# members and pin a shared SDK constraint.
# ignore: package_names
name: _
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/coffin_core
  - apps/hauntagotchi
  - apps/graveyard

dev_dependencies:
  flutter_lints: ^6.0.0
